<!DOCTYPE html>
<html>
<head><title>Plotting Map</title>
<style>
body { background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
svg { background: #f4f7f4; border: 4px solid #444; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
text { font-family: 'Courier New', monospace; font-weight: bold; font-size: 10px; fill: #222; }
</style>
</head>
<body>
<svg width="900" height="700" viewBox="0 0 900 700">

  <!-- Background / Channel -->
  <rect width="900" height="700" fill="#cde0f7"/>
  
  <!-- Very rough landmasses (stylized) -->
  <path d="M 0,150 Q 150,100 300,120 Q 400,130 500,200 Q 600,300 700,280 Q 800,260 900,300 L 900,700 L 0,700 Z" fill="#e8f0e8" stroke="#333" stroke-width="2"/>
  <path d="M 50,650 Q 150,600 250,620 Q 350,640 450,680 L 450,700 L 0,700 Z" fill="#e8f0e8" stroke="#333" stroke-width="2"/>
  <path d="M 750,300 Q 800,280 900,290 L 900,400 Q 800,380 750,350 Z" fill="#e8f0e8" stroke="#333" stroke-width="2"/>

  <!-- Grid lines -->
  <g stroke="#888" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="100" x2="900" y2="100"/><line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="300" x2="900" y2="300"/><line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="500" x2="900" y2="500"/><line x1="0" y1="600" x2="900" y2="600"/>
    <line x1="150" y1="0" x2="150" y2="700"/><line x1="300" y1="0" x2="300" y2="700"/>
    <line x1="450" y1="0" x2="450" y2="700"/><line x1="600" y1="0" x2="600" y2="700"/>
    <line x1="750" y1="0" x2="750" y2="700"/>
  </g>

  <!-- Map Plotting Function (Manual Coordinates mapped to SVG) 
       Approx mapping: Lon -3.5 to 4.5 -> X 50 to 850
       Lat 52.5 to 48.5 -> Y 50 to 650
  -->
  <g id="points">
    <!-- Blue Squares (RAF Airfields) -->
    <rect x="410" y="135" width="10" height="10" fill="#0044cc" stroke="#000" stroke-width="1"/>
    <text x="422" y="140">Biggin Hill</text>

    <rect x="460" y="108" width="10" height="10" fill="#0044cc" stroke="#000" stroke-width="1"/>
    <text x="472" y="113">Hornchurch</text>

    <rect x="310" y="108" width="10" height="10" fill="#0044cc" stroke="#000" stroke-width="1"/>
    <text x="322" y="113">Northolt</text>

    <rect x="385" y="155" width="10" height="10" fill="#0044cc" stroke="#000" stroke-width="1"/>
    <text x="397" y="160">Kenley</text>

    <rect x="490" y="60" width="10" height="10" fill="#0044cc" stroke="#000" stroke-width="1"/>
    <text x="502" y="65">Debden</rect>

    <rect x="440" y="82" width="10" height="10" fill="#0044cc" stroke="#000" stroke-width="1"/>
    <text x="452" y="87">North Weald</text>

    <rect x="240" y="218" width="10" height="10" fill="#0044cc" stroke="#000" stroke-width="1"/>
    <text x="252" y="223">Tangmere</text>

    <!-- Red Circles (French Towns) -->
    <circle cx="590" cy="210" r="6" fill="#cc0000" stroke="#000" stroke-width="1"/>
    <text x="600" y="215">Calais</text>

    <circle cx="650" cy="190" r="6" fill="#cc0000" stroke="#000" stroke-width="1"/>
    <text x="660" y="195">Dunkirk</text>

    <circle cx="570" cy="230" r="6" fill="#cc0000" stroke="#000" stroke-width="1"/>
    <text x="580" y="235">Boulogne</text>

    <circle cx="620" cy="215" r="6" fill="#cc0000" stroke="#000" stroke-width="1"/>
    <text x="630" y="220">St Omer</text>

    <circle cx="690" cy="240" r="6" fill="#cc0000" stroke="#000" stroke-width="1"/>
    <text x="700" y="245">Lille</text>

    <circle cx="700" cy="270" r="6" fill="#cc0000" stroke="#000" stroke-width="1"/>
    <text x="710" y="275">Douai</text>

    <circle cx="670" cy="285" r="6" fill="#cc0000" stroke="#000" stroke-width="1"/>
    <text x="680" y="290">Arras</text>

    <circle cx="710" cy="305" r="6" fill="#cc0000" stroke="#000" stroke-width="1"/>
    <text x="720" y="310">Cambrai</text>

    <circle cx="430" cy="370" r="6" fill="#cc0000" stroke="#000" stroke-width="1"/>
    <text x="440" y="375">Cherbourg</text>

    <circle cx="510" cy="360" r="6" fill="#cc0000" stroke="#000" stroke-width="1"/>
    <text x="520" y="365">Le Havre</text>

    <circle cx="550" cy="350" r="6" fill="#cc0000" stroke="#000" stroke-width="1"/>
    <text x="560" y="355">Rouen</text>

    <!-- Green Triangles (UK Cities/Radar) -->
    <polygon points="200,140 210,155 190,155" fill="#006600" stroke="#000" stroke-width="1"/>
    <text x="215" y="155">Bristol</text>

    <polygon points="380,250 390,265 370,265" fill="#006600" stroke="#000" stroke-width="1"/>
    <text x="395" y="260">Southampton</text>

    <polygon points="280,200 290,215 270,215" fill="#006600" stroke="#000" stroke-width="1"/>
    <text x="295" y="210">Basingstoke</text>

    <polygon points="345,215 355,230 335,230" fill="#006600" stroke="#000" stroke-width="1"/>
    <text x="360" y="225">Guildford</text>

    <polygon points="310,220 320,235 300,235" fill="#006600" stroke="#000" stroke-width="1"/>
    <text x="325" y="230">Winchester</text>

    <polygon points="360,235 370,250 350,250" fill="#006600" stroke="#000" stroke-width="1"/>
    <text x="375" y="245">Horsham</text>

    <polygon points="460,250 470,265 450,265" fill="#006600" stroke="#000" stroke-width="1"/>
    <text x="475" y="255">Mayfield</text>

    <polygon points="160,240 170,255 150,255" fill="#006600" stroke="#000" stroke-width="1"/>
    <text x="175" y="250">Yeovil</text>

    <polygon points="140,215 150,230 130,230" fill="#006600" stroke="#000" stroke-width="1"/>
    <text x="155" y="225">Glastonbury</text>

    <polygon points="220,310 230,325 210,325" fill="#006600" stroke="#000" stroke-width="1"/>
    <text x="235" y="320">Bournemouth</text>

    <polygon points="530,260 540,275 520,275" fill="#006600" stroke="#000" stroke-width="1"/>
    <text x="545" y="265">Hastings</text>

    <polygon points="320,370 330,385 310,385" fill="#006600" stroke="#000" stroke-width="1"/>
    <text x="335" y="380">Isle of Wight</text>

    <polygon points="280,420 290,435 270,435" fill="#006600" stroke="#000" stroke-width="1"/>
    <text x="295" y="430">Portland</text>

    <polygon points="490,280 500,295 480,295" fill="#006600" stroke="#000" stroke-width="1"/>
    <text x="505" y="285">Beachy Head</text>

    <polygon points="220,280 230,295 210,295" fill="#006600" stroke="#000" stroke-width="1"/>
    <text x="235" y="290">Selsey Bill</text>

    <!-- SAMPLE W RAID TRACKS -->
    <line x1="580" y1="230" x2="480" y2="140" stroke="#ff4444" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="580" y="225" fill="#ff4444" font-size="14" font-weight="bold">W</text>

    <line x1="630" y1="200" x2="510" y2="80" stroke="#ff4444" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="630" y="195" fill="#ff4444" font-size="14" font-weight="bold">W</text>

    <line x1="540" y1="280" x2="420" y2="200" stroke="#ff4444" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="540" y="275" fill="#ff4444" font-size="14" font-weight="bold">W</text>
  </g>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff4444"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#111">PLOTTING TABLE - BATTLE OF BRITAIN BUNKER</text>
  <text x="450" y="670" font-size="10" fill="#555" text-anchor="middle">SECTOR MAP // SOUTHERN ENGLAND &amp; NORTHERN FRANCE</text>
</svg>
</body>
</html>
