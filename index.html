<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Eyes On The Sky</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="assets/images/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/images/icon-192.png" />
    <link rel="stylesheet" href="css/game.css" />
</head>
<body>
    <div id="game-container"></div>

    <!-- 1. Loads Phaser from a local file — a classroom tablet can't count on
         reliable network, so this can't depend on a CDN. -->
    <script src="js/phaser.min.js"></script>

    <!-- 2. Loads the main game scripts -->
    <script src="js/audio/AudioManager.js"></script>
    <script src="js/scenes/BaseGameScene.js"></script>
    <script src="js/scenes/IntroScene.js"></script>
    <script src="js/scenes/DetectionScene.js"></script>
    <script src="js/scenes/ToteBoardScene.js"></script>
    <script src="js/scenes/DecisionScene.js"></script>
    <script src="js/scenes/InterceptScene.js"></script>
    <script src="js/scenes/ResultScene.js"></script>
    <script src="js/scenes/DebugMenuScene.js"></script>
    <script src="js/main.js"></script>

    <!-- Registers the offline service worker (sw.js) so the game keeps
         working with no connection once it's been loaded/played through
         once — see sw.js for why. -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>
</body>
</html>
